[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-skin-model"
version = "1.0.0"
description = "Hyperspectral Skin Cancer Classification — Model Training"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
hpo = ["optuna>=3.0"]
tracking = ["mlflow>=2.0"]
explain = ["captum>=0.6"]

[project.scripts]
hsi-skin = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pyright]
executionEnvironments = [
  { root = "." }
]